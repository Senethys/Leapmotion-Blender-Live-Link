schema_version = "1.0.0"
id = "leap_live_link"
version = "1.1.0"
name = "Leap Motion Live Link"
tagline = "Stream Ultraleap hand tracking to a Blender armature"
maintainer = "Leap Motion Live Link contributors"
type = "add-on"
